<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Political Simulator - 2D Edition</title>
    <style>
        :root {
            --primary-color: #ff9933;
            --secondary-color: #138808;
            --dark-bg: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            padding: 20px;
            box-sizing: border-box;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h1 {
            text-align: center;
            color: var(--primary-color);
            font-size: 24px;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
        }
        input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 10px;
            background: #2d2d2d;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: var(--primary-color);
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background: #e68a2e;
        }
        .secondary-btn {
            background: #444;
            margin-top: 10px;
        }
        .secondary-btn:hover {
            background: #555;
        }
        .screen {
            display: none;
        }
        .active-screen {
            display: block;
        }
        .stat-box {
            background: #2d2d2d;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 15px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Screen 1: Character Creation Form Only -->
    <div id="screen-character" class="screen active-screen">
        <h1>Political Simulator 2D</h1>
        <div class="subtitle">Character Creation (Political Career Start)</div>
        
        <div class="form-group">
            <label for="char-name">Leader Name:</label>
            <input type="text" id="char-name" placeholder="Enter your name">
        </div>

        <div class="form-group">
            <label for="char-age">Age:</label>
            <input type="number" id="char-age" value="35" min="25" max="90">
        </div>

        <div class="form-group">
            <label for="char-gender">Gender:</label>
            <select id="char-gender">
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <div class="form-group">
            <label for="char-ideology">Political Ideology:</label>
            <select id="char-ideology">
                <option value="Centre">Centre</option>
                <option value="Center-Left">Center-Left</option>
                <option value="Center-Right">Center-Right</option>
                <option value="Left-Wing">Left-Wing</option>
                <option value="Right-Wing">Right-Wing</option>
            </select>
        </div>

        <div class="form-group">
            <label for="char-state">Home State:</label>
            <input type="text" id="char-state" value="Uttarakhand">
        </div>

        <div class="form-group">
            <label for="char-constituency">Lok Sabha Constituency:</label>
            <input type="text" id="char-constituency" value="Almora">
        </div>

        <button onclick="submitCharacter()">Begin Political Career</button>
    </div>

    <!-- Screen 2: Party Hub (Two Options Inside) -->
    <div id="screen-party-hub" class="screen">
        <h1>Political Party</h1>
        <div class="subtitle">Section 4 - Choose Your Path</div>
        
        <div class="stat-box">
            <p>Welcome, <span id="hub-name" style="color: var(--primary-color); font-weight: bold;"></span>!</p>
            <p style="font-size: 13px; color: #aaa; margin: 0;">Select how you want to enter politics:</p>
        </div>

        <button onclick="alert('Join Existing Party list will open here next!')">Join Existing Political Party</button>
        <button class="secondary-btn" onclick="alert('Create Your Own Party form will open here next!')">Create Your Own Party</button>
    </div>
</div>

<script>
    let playerData = {};

    function submitCharacter() {
        const name = document.getElementById('char-name').value;
        if(!name.trim()) {
            alert('Please enter your leader name!');
            return;
        }
        
        // Save character data
        playerData.name = name;
        playerData.age = document.getElementById('char-age').value;
        playerData.gender = document.getElementById('char-gender').value;
        playerData.ideology = document.getElementById('char-ideology').value;
        playerData.state = document.getElementById('char-state').value;
        playerData.constituency = document.getElementById('char-constituency').value;

        // Display name on the hub screen
        document.getElementById('hub-name').innerText = playerData.name;

        // Hide Screen 1 and show Screen 2 cleanly
        document.getElementById('screen-character').classList.remove('active-screen');
        document.getElementById('screen-party-hub').classList.add('active-screen');
    }
</script>

</body>
    </html>
